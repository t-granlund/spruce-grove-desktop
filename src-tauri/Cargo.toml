[package]
name = "spruce-grove-desktop"
version = "0.1.0"
description = "Thin desktop shell for the spruce-grove CLI"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# PIN hashing + record tamper-evidence (see studio_auth.rs). RustCrypto crates,
# pure Rust, rust-version 1.77-compatible, no build scripts.
pbkdf2 = { version = "0.12", features = ["hmac"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
getrandom = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
